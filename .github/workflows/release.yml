name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Tests marked "Desktop" need real windows or the counters of a graphics card.
      - name: Test
        run: dotnet test tests/VictoryLauncher.Tests -c Release --filter "Category!=Desktop"

      - name: Publish
        run: >
          dotnet publish src/VictoryLauncher -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:DebugSymbols=false -o publish

      - name: Pack
        shell: pwsh
        run: |
          Copy-Item packaging/LIESMICH.txt publish
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          Compress-Archive -Path publish/* -DestinationPath "VictoryLauncher-$version-win-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: VictoryLauncher-win-x64
          path: VictoryLauncher-*-win-x64.zip
          if-no-files-found: error

  # A job of its own, so that only this step may write to the repository.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: VictoryLauncher-win-x64

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" VictoryLauncher-*-win-x64.zip --repo "$GITHUB_REPOSITORY"
          --title "VictoryLauncher $GITHUB_REF_NAME" --generate-notes --verify-tag
